<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="300" height="300">
  <defs>
    <style>
      .bg {
        transform-origin: center;
        animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      .white-bracket {
        transform-origin: center;
        animation: slideTopLeft 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
        opacity: 0;
        transform: translate(15px, 15px) scale(0.8);
      }
      
      .red-bracket {
        transform-origin: center;
        animation: slideBottomRight 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
        opacity: 0;
        transform: translate(-15px, -15px) scale(0.8);
      }

      @keyframes scaleIn {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes slideTopLeft {
        0% { transform: translate(20px, 20px) scale(0.9); opacity: 0; }
        100% { transform: translate(0, 0) scale(1); opacity: 1; }
      }

      @keyframes slideBottomRight {
        0% { transform: translate(-20px, -20px) scale(0.9); opacity: 0; }
        100% { transform: translate(0, 0) scale(1); opacity: 1; }
      }
    </style>
  </defs>

  <rect class="bg" width="100" height="100" fill="#000000"/>

  <path class="white-bracket" fill="#FFFFFF" d="M 10 10 H 45 V 22 H 22 V 45 H 10 Z" />

  <path class="red-bracket" fill="#E30022" d="M 90 90 H 55 V 78 H 78 V 55 H 90 Z" />
</svg>