<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <style>
      .bg { fill: #000000; }

      .bracket {
        fill: none;
        stroke-width: 12;
        stroke-dasharray: 70; 
        animation-duration: 6s;
        animation-iteration-count: infinite;
        animation-timing-function: cubic-bezier(0.77, 0, 0.175, 1);
      }

      .white-blk {
        stroke: #FFFFFF;
        animation-name: whiteTrack;
      }

      @keyframes whiteTrack {
        0%, 10% {
          stroke-dashoffset: 0;
          transform: translate(0, 0);
        }
        20% {
          stroke-dashoffset: 58;
          transform: translate(0, 0);
        }
        30% {
          stroke-dashoffset: 58;
          transform: translate(45px, 0);
        }
        40% {
          stroke-dashoffset: 58;
          transform: translate(45px, 45px);
        }
        50% {
          stroke-dashoffset: 0;
          transform: translate(45px, 45px);
        }
        60% {
          stroke-dashoffset: 0;
          transform: translate(45px, 45px);
        }
        70% {
          stroke-dashoffset: 58;
          transform: translate(45px, 45px);
        }
        80% {
          stroke-dashoffset: 58;
          transform: translate(0, 45px);
        }
        90% {
          stroke-dashoffset: 58;
          transform: translate(0, 0);
        }
        100% {
          stroke-dashoffset: 0;
          transform: translate(0, 0);
        }
      }

      .red-blk {
        stroke: #E30022;
        animation-name: redTrack;
      }

      @keyframes redTrack {
        0%, 10% {
          stroke-dashoffset: 0;
          transform: translate(0, 0);
        }
        20% {
          stroke-dashoffset: 58;
          transform: translate(0, 0);
        }
        30% {
          stroke-dashoffset: 58;
          transform: translate(-45px, 0);
        }
        40% {
          stroke-dashoffset: 58;
          transform: translate(-45px, -45px);
        }
        50% {
          stroke-dashoffset: 0;
          transform: translate(-45px, -45px);
        }
        60% {
          stroke-dashoffset: 0;
          transform: translate(-45px, -45px);
        }
        70% {
          stroke-dashoffset: 58;
          transform: translate(-45px, -45px);
        }
        80% {
          stroke-dashoffset: 58;
          transform: translate(0, -45px);
        }
        90% {
          stroke-dashoffset: 58;
          transform: translate(0, 0);
        }
        100% {
          stroke-dashoffset: 0;
          transform: translate(0, 0);
        }
      }
    </style>
  </defs>

  <rect class="bg" width="100" height="100" />

  <path class="bracket white-blk" d="M 16 45 V 16 H 45" />
  <path class="bracket red-blk" d="M 84 55 V 84 H 55" />
</svg>